<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Knell</title>
<meta name="description" content="Knell – Yet Another EMOM Timer for kettlebell training">
<meta name="theme-color" content="#121315" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Knell">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: inherit; }

/* ── DARK THEME ─────────────────────────────────────────── */
:root {
  --bg:          #121315;
  --surface:     #1C1D21;
  --surface2:    #26272D;
  --border:      #2A2C32;
  --accent:      #B0FF00;
  --accent-dim:  rgba(176,255,0,.12);
  --accent-glow: rgba(176,255,0,.35);
  --accent-text: #0E1000;
  --mint:        #33E0A1;
  --mint-dim:    rgba(51,224,161,.12);
  --coral:       #FF4D4D;
  --coral-dim:   rgba(255,77,77,.12);
  --gold:        #FFB800;
  --gold-dim:    rgba(255,184,0,.12);
  --text:        #FFFFFF;
  --text2:       #C4C6CC;
  --muted:       #8E929B;
  --ring-track:  #26272D;
  --ring-size:   min(300px, 72vw);
  --radius-card: 20px;
  --shadow-card: none;
}

/* ── LIGHT THEME ────────────────────────────────────────── */
@media (prefers-color-scheme: light) {
  :root {
    --bg:          #F4F5F7;
    --surface:     #FFFFFF;
    --surface2:    #ECEEF2;
    --border:      #E2E4E9;
    --accent:      #0F8B4C;
    --accent-dim:  rgba(15,139,76,.10);
    --accent-glow: rgba(15,139,76,.25);
    --accent-text: #FFFFFF;
    --mint:        #0077CC;
    --mint-dim:    rgba(0,119,204,.10);
    --coral:       #E03030;
    --coral-dim:   rgba(224,48,48,.10);
    --gold:        #B06000;
    --gold-dim:    rgba(176,96,0,.10);
    --text:        #18191C;
    --text2:       #3E4149;
    --muted:       #6C727F;
    --ring-track:  #E2E4E9;
    --shadow-card: 0 4px 20px rgba(0,0,0,.04);
  }
  .card { box-shadow: var(--shadow-card); border: 1px solid var(--border); }
  .btn-start { box-shadow: 0 4px 20px var(--accent-glow) !important; }
  .btn-start:hover { box-shadow: 0 6px 28px var(--accent-glow) !important; }
  .sw-track-on { background: rgba(15,139,76,.25) !important; }
  .sw-thumb-on { background: var(--accent) !important; }
}

body {
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* header removed — info moved to footer */

/* ── MAIN ───────────────────────────────────────────────── */
main {
  width: 100%; max-width: 480px;
  padding: 20px 20px 40px;
  display: flex; flex-direction: column; align-items: center;
  gap: 16px; flex: 1;
}

/* ── STATUS PILL ────────────────────────────────────────── */
.status-pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 16px; border-radius: 100px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-size: .68rem; font-weight: 600;
  letter-spacing: .2em; text-transform: uppercase;
  color: var(--muted);
  transition: background .25s, color .25s, border-color .25s;
}
.status-pill.running   { background: var(--accent-dim);  color: var(--accent); border-color: var(--accent); }
.status-pill.half      { background: var(--mint-dim);    color: var(--mint);   border-color: var(--mint); }
.status-pill.done      { background: var(--coral-dim);   color: var(--coral);  border-color: var(--coral); }
.status-pill.countdown { background: var(--gold-dim);    color: var(--gold);   border-color: var(--gold); }
.status-pill.paused    { background: var(--surface2);    color: var(--muted);  border-color: var(--border); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.dot.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.65)} }

/* ── RING ───────────────────────────────────────────────── */
.ring-wrap {
  position: relative;
  width: var(--ring-size); aspect-ratio: 1;
  flex-shrink: 0;
  transition: width .45s cubic-bezier(.4,0,.2,1);
}
.ring-wrap.expanded { width: 100%; }
.ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg   { fill: none; stroke: var(--ring-track); stroke-width: 10; }
.ring-half {
  fill: none; stroke: var(--mint); stroke-width: 3;
  stroke-linecap: round; stroke-dasharray: 0 1000;
  opacity: .4; transition: stroke-dasharray .3s ease;
}
.ring-prog {
  fill: none; stroke: var(--accent); stroke-width: 11;
  stroke-linecap: round; stroke-dasharray: 0 1000;
  transition: stroke-dasharray .25s linear, stroke .3s;
}
.ring-inner {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0px;
}
.ring-label {
  font-size: .6rem; font-weight: 700;
  letter-spacing: .28em; color: var(--muted);
  text-transform: uppercase;
}
.ring-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(4.8rem, 22vw, 6rem);
  line-height: .95; letter-spacing: .02em;
  color: var(--text); transition: color .25s;
}
.ring-time.half { color: var(--mint); }
.ring-time.end  { color: var(--coral); }
.ring-time.go   { color: var(--gold); }


/* ── CONTROLS ───────────────────────────────────────────── */
.controls { width: 100%; display: flex; gap: 10px; align-items: center; }

.btn-icon {
  width: 56px; height: 56px; flex-shrink: 0;
  border: none; border-radius: 16px;
  background: var(--surface2);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background .2s, color .2s, transform .1s;
  border: 1px solid var(--border);
}
.btn-icon:hover { color: var(--text); background: var(--border); }
.btn-icon:active { transform: scale(.93); }
.btn-icon svg { width: 20px; height: 20px; stroke-width: 2; }
.btn-icon.danger:hover { color: var(--coral); }

.btn-start {
  flex: 1; height: 56px;
  border: none; border-radius: 16px;
  background: var(--accent); color: var(--accent-text);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.35rem; letter-spacing: .14em;
  cursor: pointer;
  box-shadow: 0 0 24px var(--accent-glow);
  transition: box-shadow .2s, transform .1s, background .2s, color .2s;
}
.btn-start:hover { box-shadow: 0 0 36px var(--accent-glow); }
.btn-start:active { transform: scale(.96); }
.btn-start:disabled {
  background: var(--surface2); color: var(--muted);
  box-shadow: none; cursor: not-allowed;
  border: 1px solid var(--border);
}

/* ── CARD ───────────────────────────────────────────────── */
.card {
  width: 100%; background: var(--surface);
  border-radius: var(--radius-card);
  border: 1px solid var(--border);
  overflow: hidden;
}

/* ── CONFIG CARD ────────────────────────────────────────── */
.config-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
}
.config-grid.death-by .rounds-field { grid-area: 1 / 1 / 2 / 2; }
.config-grid.death-by .cfg-cell:not(.rounds-field) { grid-area: 1 / 1 / 2 / 3; border-right: none; }
.cfg-cell {
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
  border-right: 1px solid var(--border);
}
.cfg-cell:last-child { border-right: none; }
.cfg-cell.error .cfg-label { color: var(--coral); }
.cfg-cell.error .stepper-val { color: var(--coral); background: var(--coral-dim); border-radius: 4px; }
.cfg-label {
  font-size: .6rem; font-weight: 700;
  letter-spacing: .22em; color: var(--muted);
  text-transform: uppercase;
}
.rounds-field { transition: opacity .25s, max-height .3s cubic-bezier(.4,0,.2,1); max-height: 100px; overflow: hidden; }
.rounds-field.hidden { opacity: 0; max-height: 0; pointer-events: none; }

.stepper { display: flex; align-items: center; gap: 0; height: 48px; }
.stepper-btn {
  width: 44px; height: 44px; flex-shrink: 0;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface2); color: var(--muted);
  font-size: 1.4rem; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background .15s, color .15s, transform .1s;
}
.stepper-btn:hover { background: var(--border); color: var(--accent); }
.stepper-btn:active { transform: scale(.9); }
.stepper-val {
  flex: 1; text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.9rem; letter-spacing: .04em;
  color: var(--text);
  background: transparent; border: none;
  -moz-appearance: textfield;
}
.stepper-val::-webkit-outer-spin-button,
.stepper-val::-webkit-inner-spin-button { -webkit-appearance: none; }
.stepper-val:focus { outline: none; }

/* ── SETTINGS COLLAPSIBLE ───────────────────────────────── */
.settings-trigger {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  color: var(--muted);
  transition: background .2s, color .2s, border-color .2s;
}
.settings-trigger:hover {
  background: var(--surface2);
  color: var(--text);
  border-color: var(--muted);
}
.settings-trigger-left {
  display: flex; align-items: center; gap: 8px;
  font-size: .72rem; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase;
}
.settings-trigger-left svg { width: 14px; height: 14px; stroke-width: 2; flex-shrink: 0; }
.settings-chevron {
  width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
.settings-chevron.open { transform: rotate(180deg); }

.settings-body {
  width: 100%;
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .32s cubic-bezier(.4,0,.2,1);
}
.settings-body.open { grid-template-rows: 1fr; }
.settings-body-inner { overflow: hidden; }

/* ── TOGGLE CARD ────────────────────────────────────────── */
.toggle-row {
  display: flex; align-items: center;
  padding: 14px 18px; gap: 14px;
  border-bottom: 1px solid var(--border);
  transition: background .15s;
}
.toggle-row:last-child { border-bottom: none; }
.toggle-icon {
  width: 32px; height: 32px; flex-shrink: 0;
  border-radius: 9px; background: var(--surface2);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.toggle-icon svg { width: 15px; height: 15px; stroke-width: 2; }
.toggle-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.toggle-title { font-size: .82rem; font-weight: 600; color: var(--text); }
.toggle-desc  { font-size: .67rem; color: var(--muted); }
.toggle-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

/* mini stepper inside toggle row */
.mini-stepper {
  display: flex; align-items: center; gap: 0;
  max-width: 108px;
  transition: max-width .3s cubic-bezier(.4,0,.2,1), opacity .2s;
}
.mini-stepper.hidden { max-width: 0; opacity: 0; pointer-events: none; overflow: hidden; }
.mini-btn {
  width: 30px; height: 30px; flex-shrink: 0;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface2); color: var(--muted);
  font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s, color .15s;
}
.mini-btn:hover { color: var(--gold); background: var(--gold-dim); }
.mini-val {
  width: 36px; text-align: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.15rem; color: var(--text);
  background: transparent; border: none;
  -moz-appearance: textfield;
}
.mini-val::-webkit-outer-spin-button,
.mini-val::-webkit-inner-spin-button { -webkit-appearance: none; }
.mini-val:focus { outline: none; }

/* ── SWITCH ─────────────────────────────────────────────── */
.sw { position: relative; width: 46px; height: 27px; flex-shrink: 0; cursor: pointer; }
.sw input { opacity: 0; width: 0; height: 0; position: absolute; }
.sw-track {
  position: absolute; inset: 0; border-radius: 14px;
  background: var(--surface2); border: 1px solid var(--border);
  transition: background .25s, border-color .25s;
}
.sw-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 21px; height: 21px; border-radius: 50%;
  background: var(--muted);
  transition: transform .25s cubic-bezier(.4,0,.2,1), background .25s, box-shadow .25s;
  pointer-events: none;
}
.sw input:checked ~ .sw-track {
  background: rgba(176,255,0,.2);
  border-color: rgba(176,255,0,.4);
}
.sw input:checked ~ .sw-thumb {
  transform: translateX(19px);
  background: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}

/* ── LOG ────────────────────────────────────────────────── */
.log-wrap { width: 100%; }
.log-title {
  font-size: .62rem; font-weight: 700;
  letter-spacing: .22em; color: var(--muted);
  text-transform: uppercase; margin-bottom: 10px;
  padding-left: 2px;
}
.log-list {
  display: flex; flex-direction: column; gap: 6px;
  max-height: 160px; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--surface2) transparent;
}
.log-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface);
  border-radius: 12px; border: 1px solid var(--border);
  animation: slideIn .3s ease;
}
@keyframes slideIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
.log-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem; color: var(--accent); min-width: 26px;
}
.log-bar-wrap { flex: 1; height: 3px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.log-bar { height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s ease; }
.log-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: .88rem; color: var(--muted);
  min-width: 34px; text-align: right;
}

/* ── FLASH ──────────────────────────────────────────────── */
#flash { pointer-events: none; position: fixed; inset: 0; opacity: 0; transition: opacity .08s; z-index: 99; }

/* ── FOOTER ─────────────────────────────────────────────── */
footer {
  width: 100%; max-width: 480px;
  padding: 16px 24px 32px;
  display: flex; flex-direction: column; align-items: center;
  gap: 3px;
}
.footer-name {
  font-size: .62rem; font-weight: 500;
  letter-spacing: .18em; color: var(--muted);
  text-transform: lowercase;
}
.footer-version {
  font-size: .55rem; font-weight: 400;
  letter-spacing: .14em; color: var(--border);
  text-transform: lowercase;
  transition: color .2s;
}
.footer-version:hover { color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .ring-prog, .ring-half { transition: none; }
  .dot.pulse { animation: none; }
}

/* ── ROUND SEGMENTS ─────────────────────────────────────── */
/* drawn via JS as <circle> arcs on r=62 */
.seg-done    { fill: none; stroke: var(--accent); opacity: .25; transition: stroke .3s; }
.seg-current { fill: none; stroke: var(--accent); opacity: .75; transition: stroke .3s; }
.seg-next    { fill: none; stroke: var(--muted);  opacity: .18; }
</style>
</head>
<body>

<main>

  <!-- STATUS -->
  <div class="status-pill" id="statusPill">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">READY</span>
  </div>

  <!-- RING -->
  <div class="ring-wrap" id="ringWrap">
    <svg viewBox="0 0 200 200">
      <defs>
        <filter id="ringGlow" x="-25%" y="-25%" width="150%" height="150%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle class="ring-bg"   cx="100" cy="100" r="86"/>
      <circle class="ring-half" cx="100" cy="100" r="86" id="ringHalf"/>
      <circle class="ring-prog" cx="100" cy="100" r="86" id="ringProg" filter="url(#ringGlow)"/>
      <!-- inner round-progress segments (drawn by JS) -->
      <g id="roundSegs" transform="rotate(-90 100 100)"></g>
    </svg>
    <div class="ring-inner">
      <div class="ring-label" id="ringLabel">SECONDS</div>
      <div class="ring-time"  id="ringTime">00</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="btn-icon danger" onclick="resetTimer()" title="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
    <button class="btn-start" id="btnStart" onclick="startTimer()">START</button>
    <button class="btn-icon" id="btnPause" onclick="pauseTimer()" disabled title="Pause">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>
  </div>

  <!-- CONFIG -->
  <div class="card" id="configCard">
    <div class="config-grid" id="configGrid">
      <div class="cfg-cell rounds-field" id="roundsField">
        <div class="cfg-label">Rounds</div>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepCfg('rounds',-1)">−</button>
          <input class="stepper-val" type="number" id="cfgRounds" value="10" min="1" max="99">
          <button class="stepper-btn" onclick="stepCfg('rounds',+1)">+</button>
        </div>
      </div>
      <div class="cfg-cell">
        <div class="cfg-label">Duration (sec)</div>
        <div class="stepper">
          <button class="stepper-btn" onclick="stepCfg('duration',-5)">−</button>
          <input class="stepper-val" type="number" id="cfgDuration" value="60" min="10" max="300" oninput="validateDuration()">
          <button class="stepper-btn" onclick="stepCfg('duration',+5)">+</button>
        </div>
      </div>
    </div>
    <div class="toggle-row" style="border-top: 1px solid var(--border); border-bottom: none">
      <div class="toggle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="toggle-info">
        <div class="toggle-title">Start timer</div>
        <div class="toggle-desc">Countdown before the EMOM begins</div>
      </div>
      <div class="toggle-right">
        <div class="mini-stepper" id="startCdStepper">
          <button class="mini-btn" onclick="stepStartCd(-5)">−</button>
          <input class="mini-val" type="number" id="cfgStartCd" value="5" min="5" max="60" step="5" readonly>
          <button class="mini-btn" onclick="stepStartCd(+5)">+</button>
        </div>
        <label class="sw">
          <input type="checkbox" id="togStartCd" onchange="onToggleStartCd()" checked>
          <div class="sw-track"></div><div class="sw-thumb"></div>
        </label>
      </div>
    </div>
  </div>

  <!-- SETTINGS TRIGGER -->
  <button class="settings-trigger" id="settingsTrigger" onclick="toggleSettings()">
    <div class="settings-trigger-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07M4.93 4.93a10 10 0 0 0 0 14.14M8.46 8.46a5 5 0 0 0 0 7.07"/></svg>
      <span id="settingsLabel">Advanced Settings</span>
    </div>
    <svg class="settings-chevron" id="settingsChevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <!-- TOGGLES (collapsible) -->
  <div class="settings-body" id="settingsBody">
    <div class="settings-body-inner">
      <div class="card" style="margin-top: 0">

    <div class="toggle-row">
      <div class="toggle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </div>
      <div class="toggle-info">
        <div class="toggle-title">End-of-round countdown</div>
        <div class="toggle-desc">Beep each second in the last 5s</div>
      </div>
      <div class="toggle-right">
        <label class="sw">
          <input type="checkbox" id="togCountdown" checked>
          <div class="sw-track"></div><div class="sw-thumb"></div>
        </label>
      </div>
    </div>

    <div class="toggle-row">
      <div class="toggle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div class="toggle-info">
        <div class="toggle-title">Halfway countdown</div>
        <div class="toggle-desc">Beep each second in the last 5s of the first half</div>
      </div>
      <div class="toggle-right">
        <label class="sw">
          <input type="checkbox" id="togHalfCountdown" checked>
          <div class="sw-track"></div><div class="sw-thumb"></div>
        </label>
      </div>
    </div>

    <div class="toggle-row">
      <div class="toggle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 4a7 7 0 0 0-7 7c0 2.38 1.19 4.47 3 5.74V19a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.26c1.81-1.27 3-3.36 3-5.74a7 7 0 0 0-7-7z"/><line x1="9" y1="17" x2="9" y2="19"/><line x1="12" y1="17" x2="12" y2="19"/><line x1="15" y1="17" x2="15" y2="19"/><circle cx="9" cy="11" r="1" fill="currentColor"/><circle cx="15" cy="11" r="1" fill="currentColor"/></svg>
      </div>
      <div class="toggle-info">
        <div class="toggle-title">Death by</div>
        <div class="toggle-desc">No round limit — keep going until failure</div>
      </div>
      <div class="toggle-right">
        <label class="sw">
          <input type="checkbox" id="togDeathBy" onchange="onToggleDeathBy()">
          <div class="sw-track"></div><div class="sw-thumb"></div>
        </label>
      </div>
    </div>

    </div><!-- /.card -->
    </div><!-- /.settings-body-inner -->
  </div><!-- /.settings-body -->
  <div class="log-wrap" id="logWrap" style="display:none">
    <div class="log-title">Round Log</div>
    <div class="log-list" id="logList"></div>
  </div>

</main>
<footer>
  <div class="footer-name">knell · yet another emom timer</div>
  <div class="footer-version" id="footerVersion"></div>
</footer>
<div id="flash"></div>

<script>
// ── WAKE LOCK ─────────────────────────────────────────────────
let wakeLock = null;
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', ()=>{ wakeLock=null; }); } catch(_) {}
}
function releaseWakeLock() { if (wakeLock) { wakeLock.release(); wakeLock=null; } }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState==='visible' && (running||inStartCd) && !paused) requestWakeLock();
});

// ── AUDIO ─────────────────────────────────────────────────────
const actx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur, type='sine', vol=0.4) {
  const o=actx.createOscillator(), g=actx.createGain();
  o.connect(g); g.connect(actx.destination);
  o.type=type; o.frequency.setValueAtTime(freq, actx.currentTime);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.start(); o.stop(actx.currentTime+dur);
}
function sndHalf()       { beep(880,.18,'triangle',.35); setTimeout(()=>beep(880,.18,'triangle',.35),220); }
function sndCountdown(n) { beep(350+(n-1)*40,.09,'square',.28); }
function sndStartCd(n)   { beep(220+(6-n)*80,.1,'triangle',.2+(6-n)*.04); }
function sndGo()         { beep(1047,.08,'square',.5); setTimeout(()=>beep(1047,.08,'square',.5),90); setTimeout(()=>beep(1319,.3,'square',.5),180); }
function sndEnd(last)    { last ? [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,'square',.3),i*120)) : (beep(660,.12,'square',.35),setTimeout(()=>beep(880,.22,'square',.4),130)); }

// ── SPEECH ────────────────────────────────────────────────────
let speechReady=false;
function prewarmSpeech() {
  if (speechReady||!window.speechSynthesis) return;
  const u=new SpeechSynthesisUtterance(''); u.volume=0; speechSynthesis.speak(u); speechReady=true;
}
function speak(text, opts={}) {
  if (!window.speechSynthesis) return;
  setTimeout(()=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=opts.rate??1.05; u.pitch=opts.pitch??1.1; u.volume=opts.vol??0.9;
    speechSynthesis.speak(u);
  }, opts.delay??0);
}

// ── STATE ─────────────────────────────────────────────────────
let totalRounds=10, roundDuration=60;
let currentRound=0, elapsed=0;
let timerID=null, running=false, paused=false, halfFired=false;
let inStartCd=false, startCdVal=0, startCdTotal=0;

// ── DOM ───────────────────────────────────────────────────────
const ringTime    = document.getElementById('ringTime');
const ringLabel   = document.getElementById('ringLabel');
const ringProg    = document.getElementById('ringProg');
const ringHalf    = document.getElementById('ringHalf');
const statusPill  = document.getElementById('statusPill');
const statusDot   = document.getElementById('statusDot');
const statusText  = document.getElementById('statusText');
const btnStart    = document.getElementById('btnStart');
const btnPause    = document.getElementById('btnPause');
const configCard  = document.getElementById('configCard');
const logWrap     = document.getElementById('logWrap');
const logList     = document.getElementById('logList');
const flash       = document.getElementById('flash');
const togCountdown     = document.getElementById('togCountdown');
const togHalfCountdown = document.getElementById('togHalfCountdown');
const togStartCd       = document.getElementById('togStartCd');
const togDeathBy       = document.getElementById('togDeathBy');
const startCdStepper   = document.getElementById('startCdStepper');
const roundsField      = document.getElementById('roundsField');
const ringWrap         = document.getElementById('ringWrap');

const CIRCUM = 2 * Math.PI * 86;
const SEG_R  = 62;   // inner ring radius
const SEG_CIRCUM = 2 * Math.PI * SEG_R;

// ── ROUND SEGMENTS ───────────────────────────────────────────
// Draws N arc segments on the inner ring (r=62).
// current=0 → all empty (reset state)
function drawRoundSegments(total, current) {
  const g = document.getElementById('roundSegs');
  g.innerHTML = '';
  if (!total || total === Infinity) {
    // Death by: single thin pulse arc showing current count
    if (current > 0) {
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx','100'); c.setAttribute('cy','100');
      c.setAttribute('r', SEG_R);
      c.setAttribute('fill','none');
      c.setAttribute('stroke', 'var(--accent)');
      c.setAttribute('stroke-width','2');
      c.setAttribute('stroke-linecap','round');
      c.setAttribute('opacity','0.5');
      c.setAttribute('stroke-dasharray',`${SEG_CIRCUM} 0`);
      g.appendChild(c);
    }
    return;
  }

  const n      = Math.min(total, 60);  // cap at 60 segs for readability
  const gap    = Math.min(4, (SEG_CIRCUM / n) * 0.18); // gap in px, max 4
  const segLen = SEG_CIRCUM / n - gap;
  const sw     = total <= 20 ? 3 : total <= 40 ? 2.5 : 2; // thinner for many rounds

  for (let i = 0; i < n; i++) {
    const offset = -(i * (segLen + gap)); // negative = clockwise from top
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx','100'); c.setAttribute('cy','100');
    c.setAttribute('r', SEG_R);
    c.setAttribute('fill','none');
    c.setAttribute('stroke-width', sw);
    c.setAttribute('stroke-linecap','round');
    c.setAttribute('stroke-dasharray', `${segLen} ${SEG_CIRCUM - segLen}`);
    c.setAttribute('stroke-dashoffset', offset);

    if (i < current - 1)      c.setAttribute('class','seg-done');
    else if (i === current -1) c.setAttribute('class','seg-current');
    else                       c.setAttribute('class','seg-next');

    g.appendChild(c);
  }
}

// ── HELPERS ───────────────────────────────────────────────────
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function isLight() { return window.matchMedia('(prefers-color-scheme: light)').matches; }
function setRingGlow(color) {
  const f = document.getElementById('ringGlow');
  if (f) f.querySelector('feGaussianBlur').setAttribute('stdDeviation', isLight() ? '2' : '3');
  ringProg.style.stroke = color;
}

// ── SETTINGS COLLAPSIBLE ──────────────────────────────────────
const settingsBody    = document.getElementById('settingsBody');
const settingsChevron = document.getElementById('settingsChevron');
const settingsLabel   = document.getElementById('settingsLabel');

function applySettingsState(open, animate=true) {
  if (!animate) settingsBody.style.transition = 'none';
  settingsBody.classList.toggle('open', open);
  settingsChevron.classList.toggle('open', open);
  settingsLabel.textContent = open ? 'Hide Settings' : 'Advanced Settings';
  if (!animate) requestAnimationFrame(()=> settingsBody.style.transition = '');
}
function toggleSettings() {
  const open = !settingsBody.classList.contains('open');
  applySettingsState(open);
  try { localStorage.setItem('knell_settings_open', open ? '1' : '0'); } catch(_) {}
}
// restore preference on load
(function() {
  let pref = '0';
  try { pref = localStorage.getItem('knell_settings_open') ?? '0'; } catch(_) {}
  applySettingsState(pref === '1', false);
})();

// ── STEPPERS ─────────────────────────────────────────────────
function stepCfg(field, delta) {
  const el = field==='rounds' ? document.getElementById('cfgRounds') : document.getElementById('cfgDuration');
  el.value = Math.min(+el.max, Math.max(+el.min, +el.value+delta));
}
function stepStartCd(delta) {
  const el = document.getElementById('cfgStartCd');
  el.value = Math.min(+el.max, Math.max(+el.min, +el.value+delta));
}
function validateDuration() {
  const el = document.getElementById('cfgDuration');
  const v = +el.value;
  el.closest('.cfg-cell').classList.toggle('error', !el.value || v < +el.min || v > +el.max);
}
function onToggleStartCd()  { startCdStepper.classList.toggle('hidden', !togStartCd.checked); }
function onToggleDeathBy()  {
  const on = togDeathBy.checked;
  roundsField.classList.toggle('hidden', on);
  document.getElementById('configGrid').classList.toggle('death-by', on);
}

// ── RING ──────────────────────────────────────────────────────
function drawRingProgress(el, total) {
  const frac = Math.min(el/total, 1);
  ringProg.style.strokeDasharray = `${frac*CIRCUM} ${CIRCUM}`;
  const halfDash = .5*CIRCUM;
  ringHalf.style.strokeDasharray = `1 ${halfDash-1} 0 ${CIRCUM-halfDash}`;
  if      (el >= total-5)    { setRingGlow(cssVar('--coral')); }
  else if (el >= total/2)    { setRingGlow(cssVar('--mint'));  }
  else                       { setRingGlow(cssVar('--accent'));}
}
function drawRingCountdown(remain, total) {
  ringProg.style.strokeDasharray = `${(remain/total)*CIRCUM} ${CIRCUM}`;
  ringHalf.style.strokeDasharray = '0 1000';
  setRingGlow(cssVar('--gold'));
}

// ── STATUS ────────────────────────────────────────────────────
function setStatus(s) {
  statusPill.className = 'status-pill ' + s;
  statusDot.className  = 'dot' + (s==='running'||s==='countdown' ? ' pulse' : '');
  ringWrap.classList.toggle('expanded', s !== '');
  statusText.textContent = {
    '':'READY', running:'WORKING', half:'HALFWAY',
    paused:'PAUSED', done:'DONE', countdown:'GET READY'
  }[s] || 'READY';
}
function flash_(color) {
  flash.style.background=color; flash.style.opacity='.12';
  setTimeout(()=>flash.style.opacity='0', 180);
}

// ── LOG ───────────────────────────────────────────────────────
function fmtSec(s) { const m=Math.floor(s/60); return m>0?`${m}:${String(s%60).padStart(2,'0')}`:`${s}s`; }
function addLog(round, sec, total) {
  const pct=Math.round(sec/total*100);
  const el=document.createElement('div'); el.className='log-item';
  el.innerHTML=`<div class="log-num">${String(round).padStart(2,'0')}</div><div class="log-bar-wrap"><div class="log-bar" style="width:0%"></div></div><div class="log-time">${fmtSec(sec)}</div>`;
  logList.prepend(el);
  requestAnimationFrame(()=>{ const b=el.querySelector('.log-bar'); b.style.width=pct+'%'; if(pct<50) b.style.background=cssVar('--coral'); });
  logWrap.style.display='block';
}

// ── LOCK CONFIG ───────────────────────────────────────────────
function lockConfig(on) {
  configCard.style.opacity      = on ? '0.35' : '1';
  configCard.style.pointerEvents= on ? 'none'  : 'auto';
}

// ── START COUNTDOWN ───────────────────────────────────────────
function initStartCd() {
  startCdTotal=Math.max(5,+document.getElementById('cfgStartCd').value);
  startCdVal=startCdTotal;
  ringLabel.textContent='STARTING IN';
  ringTime.textContent=String(startCdVal).padStart(2,'0');
  ringTime.className='ring-time go';
  drawRingCountdown(startCdVal,startCdTotal);
  setStatus('countdown');
}
function tickStartCd() {
  startCdVal--;
  if (startCdVal>0) {
    ringTime.textContent=String(startCdVal).padStart(2,'0');
    drawRingCountdown(startCdVal,startCdTotal);
    if (startCdVal<=5) sndStartCd(startCdVal);
  } else {
    clearInterval(timerID); timerID=null; inStartCd=false;
    flash_('#ffffff'); sndGo();
    speak('Go!',{rate:1.1,pitch:1.3});
    launchEmom(true);
  }
}

// ── EMOM ──────────────────────────────────────────────────────
function launchEmom(fromCountdown=false) {
  running=true; paused=false;
  startRound(1,fromCountdown);
  timerID=setInterval(tickEmom,1000);
}
function startRound(n, delaySpeak=false) {
  currentRound=n; elapsed=0; halfFired=false;
  ringLabel.textContent='SECONDS';
  ringTime.textContent=String(roundDuration).padStart(2,'0');
  ringTime.className='ring-time';
  drawRingProgress(0,roundDuration);
  drawRoundSegments(totalRounds, n);
  setStatus('running');
  speak(`Round ${n}`,{delay:delaySpeak?600:0});
}
function tickEmom() {
  elapsed++;
  const rem=roundDuration-elapsed;
  const half=Math.floor(roundDuration/2);
  ringTime.textContent=String(rem).padStart(2,'0');
  drawRingProgress(elapsed,roundDuration);
  ringTime.className=rem<=5?'ring-time end':elapsed>=half?'ring-time half':'ring-time';
  if (togCountdown.checked && rem>=1 && rem<=5) sndCountdown(rem);
  if (!halfFired && elapsed===half) {
    halfFired=true;
    sndHalf(); flash_(cssVar('--mint')); setStatus('half');
    speak('Halfway',{rate:1.0,pitch:1.05});
    setTimeout(()=>{ if(running) setStatus('running'); },1200);
  }
  const halfRemain=half-elapsed;
  if (togHalfCountdown.checked && !halfFired && halfRemain>=1 && halfRemain<=5) sndCountdown(halfRemain);
  if (elapsed>=roundDuration) {
    const last=!togDeathBy.checked && currentRound>=totalRounds;
    addLog(currentRound,elapsed,roundDuration);
    sndEnd(last); flash_(last?cssVar('--accent'):cssVar('--coral'));
    if (last) endSession(); else startRound(currentRound+1);
  }
}
function endSession() {
  clearInterval(timerID); timerID=null; running=false;
  releaseWakeLock();
  ringTime.textContent='✓'; ringTime.className='ring-time';
  ringProg.style.strokeDasharray=`${CIRCUM} 0`;
  setRingGlow(cssVar('--accent'));
  drawRoundSegments(totalRounds, totalRounds + 1); // all segments done
  setStatus('done'); speak('Workout complete!',{rate:.95,pitch:1});
  btnStart.textContent='START'; btnStart.disabled=false;
  btnPause.disabled=true; lockConfig(false);
}

// ── CONTROLS ─────────────────────────────────────────────────
function startTimer() {
  if (actx.state==='suspended') actx.resume();
  prewarmSpeech();
  if ((running||inStartCd)&&!paused) return;
  if (!running&&!inStartCd) {
    const durEl = document.getElementById('cfgDuration');
    const durVal = +durEl.value;
    if (!durEl.value || durVal < +durEl.min || durVal > +durEl.max) {
      durEl.closest('.cfg-cell').classList.add('error');
      return;
    }
    totalRounds  =togDeathBy.checked?Infinity:Math.max(1,+document.getElementById('cfgRounds').value||10);
    roundDuration=durVal;
    logList.innerHTML=''; logWrap.style.display='none';
    btnStart.disabled=true; btnPause.disabled=false; lockConfig(true);
    if (togStartCd.checked) { inStartCd=true; initStartCd(); timerID=setInterval(tickStartCd,1000); requestWakeLock(); }
    else                    { launchEmom(); requestWakeLock(); }
  } else if (paused) {
    paused=false; btnStart.disabled=true; btnStart.textContent='START';
    if (inStartCd) { setStatus('countdown'); timerID=setInterval(tickStartCd,1000); requestWakeLock(); }
    else           { setStatus('running');   timerID=setInterval(tickEmom,1000);    requestWakeLock(); }
  }
}
function pauseTimer() {
  if ((!running&&!inStartCd)||paused) return;
  clearInterval(timerID); timerID=null; paused=true;
  releaseWakeLock();
  btnStart.disabled=false; btnStart.textContent='RESUME';
  setStatus('paused');
}
function resetTimer() {
  clearInterval(timerID); timerID=null;
  releaseWakeLock();
  running=paused=inStartCd=false;
  currentRound=elapsed=startCdVal=0; halfFired=false;
  roundsField.classList.remove('hidden');
  ringLabel.textContent='SECONDS';
  ringTime.textContent='00'; ringTime.className='ring-time';
  ringProg.style.strokeDasharray=`0 ${CIRCUM}`;
  setRingGlow(cssVar('--accent'));
  ringHalf.style.strokeDasharray='0 1000';
  drawRoundSegments(0, 0); // clear segments
  setStatus('');
  btnStart.textContent='START'; btnStart.disabled=false;
  btnPause.disabled=true;
  lockConfig(false);
}

// ── VERSION ───────────────────────────────────────────────────
const APP_VERSION = '1.3.2';
document.getElementById('footerVersion').textContent = 'v' + APP_VERSION;

// ── INIT ──────────────────────────────────────────────────────
drawRingProgress(0,1); drawRoundSegments(0,0); setStatus('');

// ── SERVICE WORKER ────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
